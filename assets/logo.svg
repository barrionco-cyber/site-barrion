<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="Barrion Contabilidade e Consultoria">
  <defs>
    <linearGradient id="mark-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a4d"/>
      <stop offset="1" stop-color="#123e78"/>
    </linearGradient>
    <linearGradient id="mark-blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1668c9"/>
      <stop offset="1" stop-color="#3aa0ff"/>
    </linearGradient>
    <linearGradient id="mark-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- Emblem: abstract upward growth mark -->
  <g transform="translate(10 12)">
    <!-- left navy wing -->
    <path d="M46 8 L8 84 L40 84 L60 40 Z" fill="url(#mark-dark)"/>
    <!-- right blue wing -->
    <path d="M52 30 L86 84 L48 84 L38 60 Z" fill="url(#mark-blue)"/>
    <!-- gold accent flag at the peak -->
    <path d="M46 8 L60 14 L52 30 Z" fill="url(#mark-gold)"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(112 0)">
    <text x="0" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="1" fill="#0f356b">BARRION</text>
    <text x="2" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="17.5" font-weight="600" letter-spacing="4.2" fill="#2f6fb0">CONTABILIDADE &amp; CONSULTORIA</text>
  </g>
</svg>
